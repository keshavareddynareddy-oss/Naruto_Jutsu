services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      ENV: production
      APP_HOST: 0.0.0.0
      PORT: 8000
      CORS_ORIGINS: "*"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')",
        ]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 45s
